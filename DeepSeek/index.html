<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Always-On · ساعة الأذكار</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Playfair+Display:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;700&family=Cairo:wght@300;600;700&family=Amiri:wght@400;700&family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   1) الأساسيات والمتغيرات
   ============================================================ */
*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

:root{
  --accent:#e8c37a;
  --accent-soft:rgba(232,195,122,.55);
  --accent-glow:rgba(232,195,122,.28);
  --text:#f6f3ec;
  --muted:rgba(246,243,236,.42);
  --hairline:rgba(255,255,255,.07);

  --ring-size: min(80vw, 44vh, 360px);

  /* الخطوط الافتراضية (ستايل 1) */
  --f-display:'Orbitron', system-ui, sans-serif;
  --f-dhikr:'Cairo', system-ui, sans-serif;
  --f-ui:'Space Grotesk', system-ui, sans-serif;
}

/* --- أنماط الخطوط الثلاثة --- */
body[data-style="1"]{ --f-display:'Orbitron',sans-serif;        --f-dhikr:'Cairo',sans-serif;    }
body[data-style="2"]{ --f-display:'Playfair Display',serif;     --f-dhikr:'Amiri',serif;         }
body[data-style="3"]{ --f-display:'Space Grotesk',sans-serif;   --f-dhikr:'Tajawal',sans-serif;  }

html,body{
  height:100%;
  background:#000;                 /* أسود نقي لتوفير البطارية ومنع الـ Burn-in */
  color:var(--text);
  font-family:var(--f-dhikr);
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ============================================================
   2) المسرح والطبقات (Parallax 3D)
   ============================================================ */
.stage{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  perspective:1300px;
  perspective-origin:50% 45%;
  overflow:hidden;
  background:#000;
}

/* هالة خلفية خافتة تتنفس */
.bg-glow{
  position:absolute; inset:-25%;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 34%, rgba(232,195,122,.11), transparent 52%),
    radial-gradient(circle at 50% 96%, rgba(120,100,255,.055), transparent 58%),
    radial-gradient(circle at 8% 78%,  rgba(232,195,122,.045), transparent 45%);
  animation:breathe 10s ease-in-out infinite;
  will-change:opacity, transform;
}
@keyframes breathe{
  0%,100%{ opacity:.55; transform:scale(1); }
  50%    { opacity:1;   transform:scale(1.07); }
}

/* طبقة المحتوى المتحركة مع حركة الهاتف */
.layer{
  position:relative; z-index:2;
  width:100%; height:100%;
  display:flex; flex-direction:column;
  align-items:center; justify-content:space-between;
  padding:
    calc(env(safe-area-inset-top, 0px) + 26px)
    22px
    calc(env(safe-area-inset-bottom, 0px) + 26px);
  transform-style:preserve-3d;
  will-change:transform;
}

/* ============================================================
   3) الشريط العلوي
   ============================================================ */
.top{
  width:100%;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px;
}

.date{
  font-family:var(--f-ui);
  font-size:.76rem;
  letter-spacing:.08em;
  color:var(--muted);
  white-space:nowrap;
}

.brand{
  display:flex; align-items:center; gap:8px;
  font-family:var(--f-ui);
  font-size:.6rem;
  letter-spacing:.34em;
  color:rgba(232,195,122,.5);
  white-space:nowrap;
}
.brand .dot{
  width:6px; height:6px; border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent), 0 0 22px var(--accent-glow);
  animation:pulse 2.6s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{ opacity:1;   transform:scale(1);   }
  50%    { opacity:.35; transform:scale(.78); }
}

/* ============================================================
   4) منطقة المركز: الساعة + العد التنازلي
   ============================================================ */
.center{
  flex:1;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:clamp(18px, 4vh, 34px);
  width:100%;
}

/* --- حلقة العد التنازلي --- */
.clock-wrap{
  position:relative;
  width:var(--ring-size);
  height:var(--ring-size);
  display:grid; place-items:center;
}

.ring{
  position:absolute; inset:0;
  width:100%; height:100%;
  transform:rotate(-90deg);
  overflow:visible;
}

.ring-ticks{
  fill:none;
  stroke:rgba(255,255,255,.09);
  stroke-width:1.4;
  stroke-dasharray:1.4 8.7;
  stroke-linecap:round;
}

.ring-track{
  fill:none;
  stroke:rgba(255,255,255,.06);
  stroke-width:3;
}

.ring-progress{
  fill:none;
  stroke:url(#ringGrad);
  stroke-width:3.6;
  stroke-linecap:round;
  filter:drop-shadow(0 0 7px rgba(232,195,122,.55));
  will-change:stroke-dashoffset;
}

/* --- محتوى داخل الحلقة --- */
.clock-inner{
  position:relative; z-index:3;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:clamp(6px, 1.4vh, 12px);
  transform:translateZ(38px);
  padding:6px;
}
.clock-inner::before{
  content:'';
  position:absolute; z-index:-1;
  width:78%; height:78%; border-radius:50%;
  background:radial-gradient(circle, rgba(232,195,122,.13), transparent 70%);
  filter:blur(22px);
  animation:innerGlow 6s ease-in-out infinite;
}
@keyframes innerGlow{
  0%,100%{ opacity:.65; }
  50%    { opacity:1;   }
}

/* الوقت الضخم */
.time{
  display:flex; align-items:baseline;
  gap:.1em;
  line-height:1;
  direction:ltr;
}

.hm{
  font-family:var(--f-display);
  font-weight:600;
  font-size:clamp(2.8rem, 17vw, 5.3rem);
  letter-spacing:-.015em;
  background:linear-gradient(180deg,#ffffff 0%, #f5ead2 52%, #c9a961 100%);
  -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 22px rgba(232,195,122,.22));
  transition:font-family .45s ease;
}

body[data-style="2"] .hm{ font-weight:500; letter-spacing:-.03em; }
body[data-style="3"] .hm{ font-weight:500; letter-spacing:-.04em; }

.ampm{
  font-family:var(--f-ui);
  font-size:clamp(.62rem, 2.6vw, .82rem);
  font-weight:500;
  letter-spacing:.14em;
  color:var(--accent-soft);
  transform:translateY(-.35em);
}

/* الثواني + شريطها */
.seconds{
  display:flex; align-items:center; gap:10px;
  direction:ltr;
}

.sec-num{
  font-family:var(--f-ui);
  font-size:.78rem;
  letter-spacing:.18em;
  color:var(--accent);
  opacity:.9;
  min-width:2.2ch;
  text-align:center;
  font-variant-numeric:tabular-nums;
}

.sec-track{
  width:clamp(64px, 22vw, 96px);
  height:2px;
  border-radius:2px;
  background:rgba(255,255,255,.09);
  overflow:hidden;
}
.sec-track i{
  display:block;
  width:100%; height:100%;
  transform-origin:0 50%;
  transform:scaleX(0);
  background:linear-gradient(90deg, rgba(232,195,122,.15), var(--accent));
  box-shadow:0 0 9px rgba(232,195,122,.8);
  will-change:transform;
}

/* --- كبسولة العد التنازلي --- */
.countdown{
  display:flex; align-items:center; gap:10px;
  padding:9px 18px;
  border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.012));
  border:1px solid rgba(232,195,122,.16);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    0 0 26px rgba(232,195,122,.07);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  transform:translateZ(24px);
  direction:ltr;
}

.cd-dot{
  width:5px; height:5px; border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 9px var(--accent);
  animation:pulse 2.6s ease-in-out infinite;
  flex:0 0 auto;
}

.cd-digits{
  font-family:var(--f-ui);
  font-size:.9rem;
  font-weight:500;
  letter-spacing:.1em;
  color:var(--text);
  font-variant-numeric:tabular-nums;
  min-width:7.2ch;
  text-align:center;
}

.cd-label{
  font-family:var(--f-dhikr);
  font-size:.68rem;
  letter-spacing:.03em;
  color:var(--muted);
  direction:rtl;
  white-space:nowrap;
}

/* ============================================================
   5) قسم الأذكار
   ============================================================ */
.dhikr-area{
  width:100%;
  display:flex; flex-direction:column;
  align-items:center;
  gap:14px;
  transform:translateZ(18px);
}

.dhikr-viewport{
  height:2.9em;
  display:grid; place-items:center;
  width:100%;
  overflow:hidden;
  padding:0 6px;
}

.dhikr{
  font-family:var(--f-dhikr);
  font-weight:600;
  font-size:clamp(1.28rem, 6.2vw, 1.9rem);
  line-height:1.5;
  text-align:center;
  white-space:nowrap;
  background:linear-gradient(180deg,#ffffff 0%, #f2e2c2 45%, #d9b268 100%);
  -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 16px rgba(232,195,122,.25));

  opacity:0;
  transform:translateY(18px);
  transition:
    opacity .62s cubic-bezier(.22,1,.36,1),
    transform .62s cubic-bezier(.22,1,.36,1),
    filter .62s ease;
}
.dhikr.is-in { opacity:1; transform:translateY(0);    filter:drop-shadow(0 0 16px rgba(232,195,122,.25)); }
.dhikr.is-out{ opacity:0; transform:translateY(-18px); filter:drop-shadow(0 0 0 rgba(232,195,122,0)); }

/* مؤشرات الأذكار */
.dhikr-dots{
  display:flex; align-items:center; gap:7px;
  direction:ltr;
}
.dhikr-dots span{
  width:4px; height:4px; border-radius:50%;
  background:rgba(255,255,255,.16);
  transition:background .45s ease, box-shadow .45s ease, transform .45s ease;
}
.dhikr-dots span.active{
  background:var(--accent);
  box-shadow:0 0 9px var(--accent);
  transform:scale(1.45);
}

/* ============================================================
   6) التوست والتلميح
   ============================================================ */
.toast{
  position:fixed; z-index:60;
  top:calc(env(safe-area-inset-top, 0px) + 62px);
  left:50%;
  transform:translate(-50%, -14px);
  opacity:0; pointer-events:none;
  padding:8px 18px;
  border-radius:999px;
  font-family:var(--f-ui);
  font-size:.68rem;
  letter-spacing:.2em;
  color:var(--accent);
  background:rgba(18,16,11,.92);
  border:1px solid rgba(232,195,122,.26);
  box-shadow:0 0 30px rgba(232,195,122,.16);
  transition:opacity .35s ease, transform .35s cubic-bezier(.22,1,.36,1);
}
.toast.show{ opacity:1; transform:translate(-50%, 0); }

.hint{
  position:fixed; z-index:55;
  left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 8px);
  transform:translateX(-50%);
  font-family:var(--f-dhikr);
  font-size:.6rem;
  letter-spacing:.05em;
  color:rgba(246,243,236,.28);
  white-space:nowrap;
  opacity:0;
  animation:hintFade 7s ease forwards;
  pointer-events:none;
}
@keyframes hintFade{
  0%{ opacity:0; } 12%{ opacity:1; } 78%{ opacity:1; } 100%{ opacity:0; }
}

/* ============================================================
   7) الاستجابة وتقليل الحركة
   ============================================================ */
@media (max-height:620px){
  .dhikr-viewport{ height:2.5em; }
  .center{ gap:14px; }
}

@media (prefers-reduced-motion: reduce){
  .bg-glow, .brand .dot, .cd-dot, .clock-inner::before{ animation:none !important; }
  .dhikr, .dhikr-dots span, .toast{ transition-duration:.01ms !important; }
}
</style>
</head>

<body data-style="1">

  <div class="stage" id="stage">

    <!-- هالة الخلفية -->
    <div class="bg-glow"></div>

    <!-- طبقة المحتوى (Parallax) -->
    <div class="layer" id="layer">

      <!-- الشريط العلوي -->
      <header class="top">
        <div class="date" id="date">—</div>
        <div class="brand"><span class="dot"></span>ALWAYS&nbsp;ON</div>
      </header>

      <!-- المركز -->
      <main class="center">

        <div class="clock-wrap">

          <svg class="ring" viewBox="0 0 320 320" aria-hidden="true">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#fbf1d6"/>
                <stop offset="45%"  stop-color="#e8c37a"/>
                <stop offset="100%" stop-color="#7d6027"/>
              </linearGradient>
            </defs>

            <!-- علامات ترصيعية -->
            <circle class="ring-ticks" cx="160" cy="160" r="155"/>
            <!-- المسار -->
            <circle class="ring-track" cx="160" cy="160" r="148"/>
            <!-- التقدم -->
            <circle class="ring-progress" id="ringProgress" cx="160" cy="160" r="148"/>
          </svg>

          <div class="clock-inner">
            <div class="time">
              <span class="hm" id="hm">00:00</span>
              <span class="ampm" id="ampm">م</span>
            </div>

            <div class="seconds">
              <span class="sec-num" id="sec">00</span>
              <span class="sec-track"><i id="secFill"></i></span>
            </div>
          </div>

        </div>

        <!-- العد التنازلي حتى 5:00 م -->
        <div class="countdown">
          <span class="cd-dot"></span>
          <span class="cd-digits" id="cdDigits">00:00:00</span>
          <span class="cd-label">حتى 5:00 م</span>
        </div>

      </main>

      <!-- الأذكار -->
      <footer class="dhikr-area">
        <div class="dhikr-viewport">
          <p class="dhikr" id="dhikr">سبحان الله</p>
        </div>
        <div class="dhikr-dots" id="dhikrDots"></div>
      </footer>

    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="hint">نقرة مزدوجة لتغيير الخط · حرّك الهاتف</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     عناصر DOM
     ============================================================ */
  const $ = (id) => document.getElementById(id);

  const stage        = $('stage');
  const layer        = $('layer');
  const dateEl       = $('date');
  const hmEl         = $('hm');
  const ampmEl       = $('ampm');
  const secEl        = $('sec');
  const secFill      = $('secFill');
  const cdDigits     = $('cdDigits');
  const ringProgress = $('ringProgress');
  const dhikrEl      = $('dhikr');
  const dotsWrap     = $('dhikrDots');
  const toastEl      = $('toast');

  /* ============================================================
     1) الأذكار
     ============================================================ */
  const ADHKAR = [
    'سبحان الله',
    'الحمد لله',
    'لا إله إلا الله',
    'الله أكبر',
    'أستغفر الله',
    'لا حول ولا قوة إلا بالله',
    'سبحان الله وبحمده',
    'سبحان الله العظيم',
    'حسبنا الله ونعم الوكيل',
    'توكلت على الله'
  ];

  const DHIKR_INTERVAL = 6500;   // مدة بقاء كل ذكر (ms)
  const DHIKR_TRANS    = 620;    // مدة الانتقال (ms)

  let dhikrIndex = 0;

  // بناء نقاط المؤشر
  ADHKAR.forEach((_, i) => {
    const d = document.createElement('span');
    if (i === 0) d.className = 'active';
    dotsWrap.appendChild(d);
  });
  const dots = Array.from(dotsWrap.children);

  function setDhikr(next) {
    dhikrIndex = next;
    dhikrEl.classList.remove('is-in');
    dhikrEl.classList.add('is-out');

    setTimeout(() => {
      dhikrEl.textContent = ADHKAR[next];
      dhikrEl.classList.remove('is-out');
      void dhikrEl.offsetWidth;          // إجبار إعادة التدفق
      dhikrEl.classList.add('is-in');
      dots.forEach((d, i) => d.classList.toggle('active', i === next));
    }, DHIKR_TRANS);
  }

  // التهيئة الأولى
  dhikrEl.textContent = ADHKAR[0];
  requestAnimationFrame(() => dhikrEl.classList.add('is-in'));
  setInterval(() => setDhikr((dhikrIndex + 1) % ADHKAR.length), DHIKR_INTERVAL);

  /* ============================================================
     2) حلقة العد التنازلي — إعداد المحيط
     ============================================================ */
  const R = 148;
  const CIRC = 2 * Math.PI * R;

  ringProgress.style.strokeDasharray  = CIRC;
  ringProgress.style.strokeDashoffset = CIRC;

  const DAY_MS = 24 * 60 * 60 * 1000;

  /** يعيد وقت الهدف القادم (5:00 مساءً) */
  function getTarget(now) {
    const t = new Date(now.getTime());
    t.setHours(17, 0, 0, 0);
    if (t.getTime() <= now.getTime()) t.setDate(t.getDate() + 1);
    return t;
  }

  const pad = (n) => String(n).padStart(2, '0');
  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

  /* ============================================================
     3) حلقة الرسم الرئيسية (rAF)
     ============================================================ */
  const dateFmt = new Intl.DateTimeFormat('ar-EG-u-nu-latn', {
    weekday: 'long', day: 'numeric', month: 'long'
  });

  let lastSecond = -1;
  let lastDateStr = '';

  function render(ts) {
    const now = new Date();

    /* --- شريط الثواني: حركة سلسة جداً (كل إطار) --- */
    const smoothSec = (now.getSeconds() + now.getMilliseconds() / 1000) / 60;
    secFill.style.transform = 'scaleX(' + smoothSec.toFixed(4) + ')';

    /* --- تحديثات مرة واحدة في الثانية --- */
    const s = now.getSeconds();
    if (s !== lastSecond) {
      lastSecond = s;

      // الوقت
      const h24 = now.getHours();
      const h12 = h24 % 12 || 12;
      hmEl.textContent  = pad(h12) + ':' + pad(now.getMinutes());
      ampmEl.textContent = h24 < 12 ? 'ص' : 'م';
      secEl.textContent  = pad(s);

      // التاريخ (يتغير مرة واحدة يومياً)
      const dStr = dateFmt.format(now);
      if (dStr !== lastDateStr) { lastDateStr = dStr; dateEl.textContent = dStr; }

      // العد التنازلي
      const target = getTarget(now);
      const rem    = target.getTime() - now.getTime();

      const hh = Math.floor(rem / 3600000);
      const mm = Math.floor((rem % 3600000) / 60000);
      const ss = Math.floor((rem % 60000) / 1000);
      cdDigits.textContent = pad(hh) + ':' + pad(mm) + ':' + pad(ss);

      // الحلقة: تمتلئ بنسبة الوقت المتبقي من الدورة (24 ساعة)
      const frac = clamp01(rem / DAY_MS);
      ringProgress.style.strokeDashoffset = (CIRC * (1 - frac)).toFixed(2);
    }

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  /* ============================================================
     4) Parallax 3D — مستشعرات الحركة + الفأرة
     ============================================================ */
  let targetX = 0, targetY = 0;   // -1 → 1
  let curX = 0, curY = 0;
  let hasOrientation = false;

  function onOrientation(e) {
    if (e.gamma === null && e.beta === null) return;
    hasOrientation = true;

    const gamma = Math.max(-35, Math.min(35, e.gamma || 0)) / 35;         // يمين / يسار
    const beta  = Math.max(-35, Math.min(35, (e.beta || 0) - 45)) / 35;   // أمام / خلف

    targetX = gamma;
    targetY = beta;
  }
  window.addEventListener('deviceorientation', onOrientation, true);

  // بديل للفأرة (معاينة على الحاسب)
  window.addEventListener('mousemove', (e) => {
    if (hasOrientation) return;
    targetX = (e.clientX / window.innerWidth  - 0.5) * 2;
    targetY = (e.clientY / window.innerHeight - 0.5) * 2;
  }, { passive: true });

  function parallaxLoop() {
    curX += (targetX - curX) * 0.055;
    curY += (targetY - curY) * 0.055;

    const rotY =  curX * 5.5;     // درجات
    const rotX = -curY * 5.5;
    const trX  = -curX * 9;       // بكسل
    const trY  = -curY * 9;

    layer.style.transform =
      'rotateY(' + rotY.toFixed(2) + 'deg) ' +
      'rotateX(' + rotX.toFixed(2) + 'deg) ' +
      'translate3d(' + trX.toFixed(2) + 'px,' + trY.toFixed(2) + 'px,0)';

    requestAnimationFrame(parallaxLoop);
  }
  requestAnimationFrame(parallaxLoop);

  /* ============================================================
     5) تبديل أنماط الخطوط (نقرة مزدوجة)
     ============================================================ */
  const STYLES = [
    { id: '1', label: 'TECH'    },
    { id: '2', label: 'ELEGANT' },
    { id: '3', label: 'MODERN'  }
  ];
  let styleIdx = 0;
  let toastTimer = null;

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  function applyStyle(i) {
    styleIdx = i;
    document.body.dataset.style = STYLES[i].id;
    showToast(STYLES[i].label);
  }

  let lastTap = 0;
  stage.addEventListener('pointerup', () => {
    const now = Date.now();
    if (now - lastTap < 320) {
      applyStyle((styleIdx + 1) % STYLES.length);
      lastTap = 0;
    } else {
      lastTap = now;
    }
  });

  /* ============================================================
     6) إذن مستشعرات الحركة (iOS 13+)
     ============================================================ */
  function requestOrientationPermission() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().catch(() => {});
    }
  }
  window.addEventListener('pointerdown', requestOrientationPermission, { once: true });

  /* ============================================================
     7) إبقاء الشاشة مضاءة (Wake Lock)
     ============================================================ */
  let wakeLock = null;

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (err) { /* المتصفح لا يدعم — تجاهل */ }
  }

  requestWakeLock();

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      requestWakeLock();
      lastSecond = -1; // فرض إعادة المزامنة عند العودة
    }
  });

  /* ============================================================
     8) منع التكبير بالنقر المزدوج / الإيماءات
     ============================================================ */
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

})();
</script>
</body>
</html>
