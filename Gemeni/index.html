<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AOD Watch Face</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --glow-color: rgba(255, 255, 255, 0.15);
            --accent-color-1: #4facfe;
            --accent-color-2: #00f2fe;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            transition: font-family 0.5s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Font Classes */
        .font-1 { font-family: 'Cairo', sans-serif; }
        .font-2 { font-family: 'Tajawal', sans-serif; }
        .font-3 { font-family: 'Amiri', serif; }

        .watch-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        /* Time Display */
        .time-section {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            justify-content: center;
            margin-bottom: 40px;
        }

        .main-time {
            font-size: 6rem;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(180deg, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px var(--glow-color);
            letter-spacing: 2px;
        }

        .seconds-container {
            display: flex;
            flex-direction: column;
            margin-right: 15px;
            justify-content: center;
            align-items: center;
        }

        .seconds {
            font-size: 2.2rem;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1;
            margin-bottom: 5px;
        }

        .ampm {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Countdown Section */
        .countdown-section {
            width: 85%;
            max-width: 350px;
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background-color: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-color-1) 0%, var(--accent-color-2) 100%);
            border-radius: 10px;
            box-shadow: 0 0 15px var(--accent-color-2);
            will-change: width;
        }

        .countdown-text {
            margin-top: 15px;
            font-size: 1rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
        }

        /* Azkar Section */
        .azkar-section {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            perspective: 1000px;
        }

        .zekr-text {
            font-size: 1.8rem;
            font-weight: 400;
            text-shadow: 0 0 25px var(--glow-color);
            opacity: 1;
            transform: translateY(0);
            transition: opacity 1.2s ease, transform 1.2s ease;
            text-align: center;
            width: 100%;
            position: absolute;
        }

        .zekr-text.fade-out {
            opacity: 0;
            transform: translateY(-25px);
        }

        .zekr-text.prepare {
            opacity: 0;
            transform: translateY(25px);
            transition: none;
        }

        /* Soft corners instruction implemented globally */
        * {
            border-radius: 20px;
        }
    </style>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<meta name="application-name" content="Moment · Gemini">
<meta name="apple-mobile-web-app-title" content="Moment Gemini">
</head>
<body class="font-1">

    <div class="watch-container" id="parallax-container">
        <!-- Time Section -->
        <div class="time-section">
            <div class="main-time" id="hours-minutes">00:00</div>
            <div class="seconds-container">
                <div class="seconds" id="seconds">00</div>
                <div class="ampm" id="ampm">AM</div>
            </div>
        </div>

        <!-- Countdown Section -->
        <div class="countdown-section">
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
            <div class="countdown-text" id="countdown-text">- 00:00:00 -</div>
        </div>

        <!-- Azkar Section -->
        <div class="azkar-section">
            <div class="zekr-text" id="zekr">سبحان الله</div>
        </div>
    </div>

    <script>
        // Data Arrays
        const azkar = [
            "سبحان الله",
            "الحمد لله",
            "لا إله إلا الله",
            "الله أكبر",
            "أستغفر الله",
            "لا حول ولا قوة إلا بالله",
            "سبحان الله وبحمده",
            "سبحان الله العظيم",
            "حسبنا الله ونعم الوكيل",
            "توكلت على الله"
        ];
        
        const fontClasses = ['font-1', 'font-2', 'font-3'];
        let currentFont = 0;
        let currentZekr = 0;

        // DOM Elements
        const elHoursMinutes = document.getElementById('hours-minutes');
        const elSeconds = document.getElementById('seconds');
        const elAmpm = document.getElementById('ampm');
        const elProgressBar = document.getElementById('progress-bar');
        const elCountdownText = document.getElementById('countdown-text');
        const elZekr = document.getElementById('zekr');
        const parallaxContainer = document.getElementById('parallax-container');

        // Font Switcher (Double Tap)
        let lastTap = 0;
        document.body.addEventListener('touchstart', (e) => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 400 && tapLength > 0) {
                currentFont = (currentFont + 1) % fontClasses.length;
                document.body.className = fontClasses[currentFont];
                e.preventDefault();
            }
            lastTap = currentTime;
        }, { passive: false });

        document.body.addEventListener('dblclick', () => {
            currentFont = (currentFont + 1) % fontClasses.length;
            document.body.className = fontClasses[currentFont];
        });

        // Device Orientation (Parallax 3D Effect)
        let orientationEnabled = false;
        function handleOrientation(event) {
            let x = event.gamma || 0; 
            let y = event.beta || 0;  

            // Constrain values
            if (x > 45) x = 45;
            if (x < -45) x = -45;
            if (y > 45) y = 45;
            if (y < -45) y = -45;

            const xPos = (x / 45) * 15;
            const yPos = (y / 45) * 15;

            parallaxContainer.style.transform = `translate(${xPos}px, ${yPos}px)`;
        }

        // Enable sensors on first interaction (Required for iOS 13+)
        document.body.addEventListener('click', () => {
            if (!orientationEnabled) {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(response => {
                            if (response == 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                                orientationEnabled = true;
                            }
                        })
                        .catch(console.error);
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                    orientationEnabled = true;
                }
            }
        });

        // Azkar Animation Logic
        setInterval(() => {
            elZekr.classList.add('fade-out');
            
            setTimeout(() => {
                currentZekr = (currentZekr + 1) % azkar.length;
                elZekr.innerText = azkar[currentZekr];
                
                elZekr.classList.remove('fade-out');
                elZekr.classList.add('prepare');
                
                // Trigger reflow
                void elZekr.offsetWidth;
                
                elZekr.classList.remove('prepare');
            }, 1200); 
        }, 6000);

        // Core Time & Countdown Engine (Smooth Animation Frame)
        let lastSecond = -1;
        
        function updateTimeEngine() {
            const now = new Date();
            
            // 1. Update Clock (Only update DOM when seconds change to save battery/resources)
            const sec = now.getSeconds();
            if (sec !== lastSecond) {
                let hours = now.getHours();
                const min = now.getMinutes();
                const ampm = hours >= 12 ? 'PM' : 'AM';
                
                hours = hours % 12;
                hours = hours ? hours : 12; // 0 becomes 12
                
                elHoursMinutes.innerText = `${String(hours).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
                elSeconds.innerText = String(sec).padStart(2, '0');
                elAmpm.innerText = ampm;
                
                lastSecond = sec;
            }

            // 2. Update Countdown to 05:00 PM (17:00:00)
            let target = new Date();
            target.setHours(17, 0, 0, 0);

            if (now > target) {
                target.setDate(target.getDate() + 1);
            }

            const diffMs = target - now;
            
            // Format remaining time
            const h = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diffMs % (1000 * 60)) / 1000);
            
            elCountdownText.innerText = `- ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')} -`;

            // Progress Bar (Base on a 24-hour cycle approaching target)
            const totalMs = 24 * 60 * 60 * 1000;
            const elapsedMs = totalMs - diffMs;
            let progressPercent = (elapsedMs / totalMs) * 100;
            
            if(progressPercent > 100) progressPercent = 100;
            if(progressPercent < 0) progressPercent = 0;

            elProgressBar.style.width = `${progressPercent}%`;

            requestAnimationFrame(updateTimeEngine);
        }

        // Initialize Engine
        requestAnimationFrame(updateTimeEngine);

    </script>
<script>
(() => {
 "use strict";
 const APP={"dir":"Gemeni","name":"Gemini","accent":"#6cbfff"};
 const UI="<style>\n:host{all:initial;direction:rtl;font-family:system-ui,Tahoma,sans-serif;color:#f1f7f8}\n*{box-sizing:border-box}\n.backdrop{position:fixed;inset:0;background:rgba(3,9,14,.68);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}\n.stage{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:15px 13px max(18px,env(safe-area-inset-bottom));pointer-events:none}\n.panel{pointer-events:auto;width:min(100%,420px);border-radius:28px;border:1px solid #ffffff30;background:linear-gradient(140deg,#1c2a31,#0b1117);box-shadow:0 24px 85px #000d;padding:26px 23px 18px;animation:appear .5s cubic-bezier(.2,.8,.3,1)}\n.head{display:flex;align-items:center;gap:13px}.head img{width:62px;height:62px;border-radius:18px;box-shadow:0 4px 24px #0004}.overline{font-size:10px;letter-spacing:1.7px;color:#9bb4bd;direction:ltr;text-align:right;font-weight:750}.app-name{font-size:20px;font-weight:850;margin-top:6px}\nh2{font-size:23px;line-height:1.5;margin:22px 0 8px}p{font-size:13px;line-height:2;color:#afc0c7;margin:0 0 19px}\nbutton{font-family:inherit;cursor:pointer}.install{width:100%;border:0;min-height:54px;border-radius:15px;background:var(--accent,#099999);color:#061419;font-weight:900;font-size:15px}\n.install:active{transform:scale(.985)}.later{display:block;margin:6px auto 0;padding:13px;color:#afbdc4;background:transparent;border:0;font-size:13px}\n.hint{display:none;background:#ffffff13;color:#e5edef;margin-top:12px;padding:12px;border-radius:12px;font-size:12px;line-height:2}.hint.active{display:block}\n@keyframes appear{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.panel{animation:none}}\n</style><div class=\"backdrop\" id=\"outside\"></div>\n<div class=\"stage\"><section class=\"panel\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"installHeading\">\n<div class=\"head\"><img src=\"./icon-192.png\" alt=\"\"><div><div class=\"overline\">MOMENT · ANDROID APP</div><div class=\"app-name\" id=\"appName\"></div></div></div>\n<h2 id=\"installHeading\">ثبت هالنسخة كتطبيق على موبايلك</h2>\n<p>بتفتح الساعة مباشرة بشاشة كاملة، باسم النسخة وأيقونتها الخاصة، بدون شريط المتصفح</p>\n<button class=\"install\" id=\"installBtn\" type=\"button\">تثبيت التطبيق على أندرويد</button>\n<div class=\"hint\" id=\"hint\" role=\"status\"></div>\n<button class=\"later\" id=\"later\" type=\"button\">المتابعة بدون تثبيت</button>\n</section></div>";
 if("serviceWorker" in navigator && window.isSecureContext){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(()=>{}),{once:true});
 }
 if(!/Android/i.test(navigator.userAgent))return;
 const standalone=()=>matchMedia("(display-mode:standalone)").matches||matchMedia("(display-mode:fullscreen)").matches||!!navigator.standalone;
 if(standalone())return;
 try{if(sessionStorage.getItem("moment-install-dismiss-"+APP.dir)==="yes")return;}catch(_){}
 let installEvent=null,host=null,shadow=null;
 function close(save){
  if(save)try{sessionStorage.setItem("moment-install-dismiss-"+APP.dir,"yes");}catch(_){}
  if(host)host.remove();
  host=null;
 }
 function guide(){
  if(!shadow)return;
  const hint=shadow.getElementById("hint");
  hint.textContent=/SamsungBrowser/i.test(navigator.userAgent)
   ?"من قائمة Samsung Internet اختر إضافة إلى الشاشة الرئيسية ثم تثبيت"
   :"افتح قائمة ⋮ في Chrome واختر تثبيت التطبيق أو إضافة إلى الشاشة الرئيسية. قد يحتاج المتصفح بعض الوقت والتفاعل مع الصفحة قبل إظهار طلب التثبيت";
  hint.classList.add("active");
 }
 function show(){
  if(host||standalone())return;
  host=document.createElement("div");
  host.style.cssText="position:fixed;inset:0;z-index:2147483647";
  shadow=host.attachShadow({mode:"open"});shadow.innerHTML=UI;
  shadow.querySelector(".panel").style.setProperty("--accent",APP.accent);
  shadow.getElementById("appName").textContent="Moment · "+APP.name;
  shadow.getElementById("outside").addEventListener("click",()=>close(true));
  shadow.getElementById("later").addEventListener("click",()=>close(true));
  shadow.getElementById("installBtn").addEventListener("click",async ()=>{
   if(!installEvent){guide();return;}
   const event=installEvent;installEvent=null;
   try{
    await event.prompt();
    const choice=await event.userChoice;
    if(choice&&choice.outcome==="accepted")close(true);
    else guide();
   }catch(_){guide();}
  });
  document.body.appendChild(host);
 }
 window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvent=e;});
 window.addEventListener("appinstalled",()=>close(true));
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",show,{once:true});else show();
})();
</script>
</body>
