<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>سكون — شاشة توقف</title>

  <style>
    /* =========================
       1) Design tokens & reset
       ========================= */
    :root {
      --bg: #000000;
      --ink: #f7f8ff;
      --muted: #8d91a6;
      --soft: #54586c;
      --gold: #e9c878;
      --cyan: #7de7e5;
      --violet: #a58cff;
      --line: rgba(255,255,255,.105);
      --glass: rgba(255,255,255,.045);
      --glow: rgba(125,231,229,.16);
      --radius-xl: 32px;
      --radius-lg: 22px;
      --font-ui: "Cairo", "Segoe UI", Tahoma, sans-serif;
      --font-display: "Tajawal", "Arial", sans-serif;
      --font-geometric: "Noto Kufi Arabic", "Arial", sans-serif;
      --active-font: var(--font-ui);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--active-font);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    button { font: inherit; color: inherit; }

    /* =========================
       2) Main stage
       ========================= */
    .stage {
      position: relative;
      isolation: isolate;
      min-height: 100svh;
      width: 100%;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: max(22px, env(safe-area-inset-top)) 22px max(22px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% 39%, rgba(41, 57, 77, .19), transparent 35%),
        radial-gradient(circle at 12% 92%, rgba(111, 76, 178, .08), transparent 30%),
        #000;
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 42vw;
      height: 42vw;
      min-width: 210px;
      min-height: 210px;
      max-width: 420px;
      max-height: 420px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .17;
      pointer-events: none;
      animation: breathe 10s ease-in-out infinite alternate;
    }

    .stage::before { top: 17%; left: -20%; background: var(--cyan); }
    .stage::after { right: -18%; bottom: 12%; background: var(--violet); animation-delay: -4s; }

    .aurora {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .48;
      background: linear-gradient(118deg, transparent 25%, rgba(255,255,255,.025) 49%, transparent 72%);
      transform: translate3d(var(--parallax-x, 0px), var(--parallax-y, 0px), 0) scale(1.08);
      transition: transform .8s cubic-bezier(.2,.8,.2,1);
    }

    .shell {
      position: relative;
      width: min(100%, 520px);
      min-height: min(760px, 100svh - 28px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 0 4px;
      transform: translate3d(var(--parallax-x, 0px), var(--parallax-y, 0px), 0);
      transition: transform .8s cubic-bezier(.2,.8,.2,1);
    }

    /* =========================
       3) Header / status
       ========================= */
    .topbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .08em;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 14px var(--cyan);
      animation: pulse 2.8s ease-in-out infinite;
    }

    .date { color: #676b7b; }

    /* =========================
       4) Clock & countdown
       ========================= */
    .clock-panel {
      width: 100%;
      text-align: center;
      margin-top: clamp(7px, 3vh, 30px);
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: .18em;
      opacity: .9;
    }

    .time {
      direction: ltr;
      white-space: nowrap;
      font-family: var(--font-display);
      font-size: clamp(74px, 22vw, 142px);
      font-weight: 300;
      line-height: .98;
      letter-spacing: -.07em;
      text-shadow: 0 0 32px rgba(255,255,255,.12), 0 0 75px var(--glow);
      font-variant-numeric: tabular-nums;
    }

    .time .seconds {
      display: inline-block;
      min-width: 1.08em;
      color: var(--cyan);
      font-size: .42em;
      letter-spacing: -.03em;
      vertical-align: 18%;
      text-shadow: 0 0 22px rgba(125,231,229,.45);
      transition: opacity .18s ease, transform .18s ease;
    }

    .time .separator { color: #74798d; font-weight: 200; }

    .countdown {
      position: relative;
      width: min(84vw, 360px);
      margin: 23px auto 0;
      padding: 15px 18px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, rgba(255,255,255,.065), rgba(255,255,255,.018));
      box-shadow: inset 0 1px rgba(255,255,255,.06), 0 16px 50px rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
    }

    .countdown-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
    }

    .target { color: var(--gold); }

    .progress-track {
      height: 3px;
      margin-top: 13px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.09);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--violet), var(--cyan), var(--gold));
      box-shadow: 0 0 13px var(--cyan);
      transition: width .6s ease;
    }

    .remaining {
      margin-top: 9px;
      color: #d5d7e2;
      font-size: 12px;
      letter-spacing: .04em;
    }

    /* =========================
       5) Dhikr card
       ========================= */
    .dhikr-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: auto;
      padding-bottom: clamp(20px, 4vh, 44px);
    }

    .dhikr-label {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--soft);
      font-size: 10px;
      letter-spacing: .2em;
    }

    .dhikr-label::before,
    .dhikr-label::after {
      content: "";
      width: 32px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--soft));
    }

    .dhikr-label::after { transform: rotate(180deg); }

    .dhikr-card {
      position: relative;
      width: 100%;
      min-height: 97px;
      display: grid;
      place-items: center;
      padding: 18px 20px;
      overflow: hidden;
      border: 1px solid rgba(233,200,120,.14);
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(233,200,120,.075), rgba(255,255,255,.018) 45%, rgba(125,231,229,.035));
      box-shadow: inset 0 1px rgba(255,255,255,.06), 0 18px 55px rgba(0,0,0,.38);
      backdrop-filter: blur(14px);
    }

    .dhikr-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,.08), transparent 80%);
      transform: translateX(110%);
      animation: sheen 8s ease-in-out infinite;
    }

    .dhikr {
      position: relative;
      z-index: 1;
      color: #f2dfad;
      font-size: clamp(22px, 6vw, 30px);
      font-weight: 500;
      text-align: center;
      text-shadow: 0 0 22px rgba(233,200,120,.2);
      transition: opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1);
    }

    .dhikr.is-changing { opacity: 0; transform: translateY(12px); }

    .hint {
      color: #4f5363;
      font-size: 10px;
      opacity: .78;
    }

    /* Hidden but accessible controls */
    .font-toggle {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      left: 8px;
      z-index: 10;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      opacity: .01;
      cursor: pointer;
    }

    .font-toggle:focus-visible { opacity: .8; outline: 1px solid var(--cyan); }

    /* =========================
       6) Animation & responsiveness
       ========================= */
    @keyframes breathe { from { transform: scale(.92); opacity: .11; } to { transform: scale(1.12); opacity: .2; } }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.25); } }
    @keyframes sheen { 0%, 35% { transform: translateX(110%); } 65%,100% { transform: translateX(-110%); } }

    @media (max-height: 650px) {
      .shell { gap: 10px; }
      .clock-panel { margin-top: 0; }
      .countdown { margin-top: 12px; padding: 11px 15px 12px; }
      .dhikr-wrap { padding-bottom: 4px; }
      .dhikr-card { min-height: 78px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<meta name="application-name" content="Moment · Manus">
<meta name="apple-mobile-web-app-title" content="Moment Manus">
</head>
<body>
  <main class="stage" id="stage" aria-label="شاشة توقف تعرض الوقت والأذكار">
    <div class="aurora" aria-hidden="true"></div>
    <button class="font-toggle" id="fontToggle" aria-label="تبديل نمط الخط" title="تبديل الخط"></button>

    <section class="shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark"></span><span>سكون</span></div>
        <time class="date" id="date" datetime=""></time>
      </header>

      <section class="clock-panel" aria-live="polite">
        <div class="eyebrow">الوقت الآن</div>
        <div class="time" id="time" aria-label="الوقت الحالي">
          <span id="hours">00</span><span class="separator">:</span><span id="minutes">00</span><span class="separator">:</span><span class="seconds" id="seconds">00</span>
        </div>

        <div class="countdown" aria-label="الوقت المتبقي حتى الخامسة مساءً">
          <div class="countdown-head"><span>المتبقي حتى</span><span class="target">05:00 PM</span></div>
          <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
          <div class="remaining" id="remaining">جارٍ الحساب...</div>
        </div>
      </section>

      <section class="dhikr-wrap" aria-live="polite">
        <div class="dhikr-label">ذكر اليوم</div>
        <div class="dhikr-card"><div class="dhikr" id="dhikr">سبحان الله</div></div>
        <div class="hint">نقرة مزدوجة لتغيير الخط</div>
      </section>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const stage = $("stage");
      const hoursEl = $("hours");
      const minutesEl = $("minutes");
      const secondsEl = $("seconds");
      const dateEl = $("date");
      const remainingEl = $("remaining");
      const progressBar = $("progressBar");
      const dhikrEl = $("dhikr");
      const fontToggle = $("fontToggle");

      const dhikrList = [
        "سبحان الله", "الحمد لله", "لا إله إلا الله", "الله أكبر", "أستغفر الله",
        "لا حول ولا قوة إلا بالله", "سبحان الله وبحمده", "سبحان الله العظيم",
        "حسبنا الله ونعم الوكيل", "توكلت على الله"
      ];

      const fontThemes = [
        { name: "Cairo", value: '"Cairo", "Segoe UI", Tahoma, sans-serif' },
        { name: "Tajawal", value: '"Tajawal", "Arial", sans-serif' },
        { name: "Noto Kufi", value: '"Noto Kufi Arabic", "Arial", sans-serif' }
      ];

      let fontIndex = Number(localStorage.getItem("sukoon-font-index") || 0);
      let dhikrIndex = 0;
      let lastSecond = -1;
      let lastDate = "";
      let lastTouch = 0;

      const pad = (number) => String(number).padStart(2, "0");

      function applyFont() {
        document.documentElement.style.setProperty("--active-font", fontThemes[fontIndex].value);
        localStorage.setItem("sukoon-font-index", fontIndex);
      }

      function toggleFont() {
        fontIndex = (fontIndex + 1) % fontThemes.length;
        applyFont();
        document.body.animate(
          [{ opacity: .72, transform: "scale(.995)" }, { opacity: 1, transform: "scale(1)" }],
          { duration: 420, easing: "cubic-bezier(.2,.8,.2,1)" }
        );
      }

      function getNextFivePM(now) {
        const target = new Date(now);
        target.setHours(17, 0, 0, 0);
        if (target <= now) target.setDate(target.getDate() + 1);
        return target;
      }

      function updateClock(now = new Date()) {
        const h = now.getHours();
        const m = now.getMinutes();
        const s = now.getSeconds();
        const ms = now.getMilliseconds();

        if (s !== lastSecond) {
          hoursEl.textContent = pad(h);
          minutesEl.textContent = pad(m);
          secondsEl.textContent = pad(s);
          secondsEl.style.transform = "translateY(-2px)";
          requestAnimationFrame(() => { secondsEl.style.transform = "translateY(0)"; });
          lastSecond = s;
        }

        const dateText = now.toLocaleDateString("ar-SA", { weekday: "long", day: "numeric", month: "long" });
        if (dateText !== lastDate) {
          dateEl.textContent = dateText;
          dateEl.dateTime = now.toISOString();
          lastDate = dateText;
        }

        const target = getNextFivePM(now);
        const previous = new Date(target);
        previous.setDate(previous.getDate() - 1);
        const totalWindow = target - previous;
        const left = target - now;
        const progress = Math.min(100, Math.max(0, ((totalWindow - left) / totalWindow) * 100));
        progressBar.style.width = `${progress}%`;

        const totalSeconds = Math.max(0, Math.floor(left / 1000));
        const rh = Math.floor(totalSeconds / 3600);
        const rm = Math.floor((totalSeconds % 3600) / 60);
        const rs = totalSeconds % 60;
        remainingEl.textContent = `${pad(rh)} ساعة و ${pad(rm)} دقيقة و ${pad(rs)} ثانية`;

        // Keeps the second hand / digital seconds visually fluid between ticks.
        secondsEl.style.opacity = String(.72 + ((ms / 1000) * .28));
        requestAnimationFrame(() => updateClock(new Date()));
      }

      function rotateDhikr() {
        dhikrEl.classList.add("is-changing");
        setTimeout(() => {
          dhikrIndex = (dhikrIndex + 1) % dhikrList.length;
          dhikrEl.textContent = dhikrList[dhikrIndex];
          dhikrEl.classList.remove("is-changing");
        }, 560);
      }

      function handleOrientation(event) {
        const gamma = Math.max(-25, Math.min(25, event.gamma || 0));
        const beta = Math.max(-25, Math.min(25, (event.beta || 0) - 35));
        stage.style.setProperty("--parallax-x", `${gamma * .22}px`);
        stage.style.setProperty("--parallax-y", `${beta * .12}px`);
      }

      function enableMotion() {
        if (typeof DeviceOrientationEvent === "undefined") return;
        if (typeof DeviceOrientationEvent.requestPermission === "function") {
          DeviceOrientationEvent.requestPermission().then((permission) => {
            if (permission === "granted") window.addEventListener("deviceorientation", handleOrientation, true);
          }).catch(() => {});
        } else {
          window.addEventListener("deviceorientation", handleOrientation, true);
        }
      }

      // Double tap anywhere changes the typography style.
      document.addEventListener("pointerup", (event) => {
        const now = Date.now();
        if (now - lastTouch < 330) toggleFont();
        lastTouch = now;
        if (event.target === fontToggle) toggleFont();
      });

      fontToggle.addEventListener("click", toggleFont);
      window.addEventListener("pointerdown", enableMotion, { once: true, passive: true });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) updateClock();
      });

      applyFont();
      rotateDhikr();
      setInterval(rotateDhikr, 6000);
      updateClock();
    })();
  </script>
<script>
(() => {
 "use strict";
 const APP={"dir":"Manus","name":"Manus","accent":"#a58cff"};
 const UI="<style>\n:host{all:initial;direction:rtl;font-family:system-ui,Tahoma,sans-serif;color:#f1f7f8}\n*{box-sizing:border-box}\n.backdrop{position:fixed;inset:0;background:rgba(3,9,14,.68);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}\n.stage{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:15px 13px max(18px,env(safe-area-inset-bottom));pointer-events:none}\n.panel{pointer-events:auto;width:min(100%,420px);border-radius:28px;border:1px solid #ffffff30;background:linear-gradient(140deg,#1c2a31,#0b1117);box-shadow:0 24px 85px #000d;padding:26px 23px 18px;animation:appear .5s cubic-bezier(.2,.8,.3,1)}\n.head{display:flex;align-items:center;gap:13px}.head img{width:62px;height:62px;border-radius:18px;box-shadow:0 4px 24px #0004}.overline{font-size:10px;letter-spacing:1.7px;color:#9bb4bd;direction:ltr;text-align:right;font-weight:750}.app-name{font-size:20px;font-weight:850;margin-top:6px}\nh2{font-size:23px;line-height:1.5;margin:22px 0 8px}p{font-size:13px;line-height:2;color:#afc0c7;margin:0 0 19px}\nbutton{font-family:inherit;cursor:pointer}.install{width:100%;border:0;min-height:54px;border-radius:15px;background:var(--accent,#099999);color:#061419;font-weight:900;font-size:15px}\n.install:active{transform:scale(.985)}.later{display:block;margin:6px auto 0;padding:13px;color:#afbdc4;background:transparent;border:0;font-size:13px}\n.hint{display:none;background:#ffffff13;color:#e5edef;margin-top:12px;padding:12px;border-radius:12px;font-size:12px;line-height:2}.hint.active{display:block}\n@keyframes appear{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.panel{animation:none}}\n</style><div class=\"backdrop\" id=\"outside\"></div>\n<div class=\"stage\"><section class=\"panel\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"installHeading\">\n<div class=\"head\"><img src=\"./icon-192.png\" alt=\"\"><div><div class=\"overline\">MOMENT · ANDROID APP</div><div class=\"app-name\" id=\"appName\"></div></div></div>\n<h2 id=\"installHeading\">ثبت هالنسخة كتطبيق على موبايلك</h2>\n<p>بتفتح الساعة مباشرة بشاشة كاملة، باسم النسخة وأيقونتها الخاصة، بدون شريط المتصفح</p>\n<button class=\"install\" id=\"installBtn\" type=\"button\">تثبيت التطبيق على أندرويد</button>\n<div class=\"hint\" id=\"hint\" role=\"status\"></div>\n<button class=\"later\" id=\"later\" type=\"button\">المتابعة بدون تثبيت</button>\n</section></div>";
 if("serviceWorker" in navigator && window.isSecureContext){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(()=>{}),{once:true});
 }
 if(!/Android/i.test(navigator.userAgent))return;
 const standalone=()=>matchMedia("(display-mode:standalone)").matches||matchMedia("(display-mode:fullscreen)").matches||!!navigator.standalone;
 if(standalone())return;
 try{if(sessionStorage.getItem("moment-install-dismiss-"+APP.dir)==="yes")return;}catch(_){}
 let installEvent=null,host=null,shadow=null;
 function close(save){
  if(save)try{sessionStorage.setItem("moment-install-dismiss-"+APP.dir,"yes");}catch(_){}
  if(host)host.remove();
  host=null;
 }
 function guide(){
  if(!shadow)return;
  const hint=shadow.getElementById("hint");
  hint.textContent=/SamsungBrowser/i.test(navigator.userAgent)
   ?"من قائمة Samsung Internet اختر إضافة إلى الشاشة الرئيسية ثم تثبيت"
   :"افتح قائمة ⋮ في Chrome واختر تثبيت التطبيق أو إضافة إلى الشاشة الرئيسية. قد يحتاج المتصفح بعض الوقت والتفاعل مع الصفحة قبل إظهار طلب التثبيت";
  hint.classList.add("active");
 }
 function show(){
  if(host||standalone())return;
  host=document.createElement("div");
  host.style.cssText="position:fixed;inset:0;z-index:2147483647";
  shadow=host.attachShadow({mode:"open"});shadow.innerHTML=UI;
  shadow.querySelector(".panel").style.setProperty("--accent",APP.accent);
  shadow.getElementById("appName").textContent="Moment · "+APP.name;
  shadow.getElementById("outside").addEventListener("click",()=>close(true));
  shadow.getElementById("later").addEventListener("click",()=>close(true));
  shadow.getElementById("installBtn").addEventListener("click",async ()=>{
   if(!installEvent){guide();return;}
   const event=installEvent;installEvent=null;
   try{
    await event.prompt();
    const choice=await event.userChoice;
    if(choice&&choice.outcome==="accepted")close(true);
    else guide();
   }catch(_){guide();}
  });
  document.body.appendChild(host);
 }
 window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvent=e;});
 window.addEventListener("appinstalled",()=>close(true));
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",show,{once:true});else show();
})();
</script>
